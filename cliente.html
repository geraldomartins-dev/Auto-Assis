<!doctype html>
<html lang="pt-BR">
<head>
  <script src="auth.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Meus atendimentos — Auto+Assis</title>
  <link rel="stylesheet" href="product.css">
  <style>
    :root {
      --client-paper: #f0eee7;
      --client-paper-strong: #fffdf7;
      --client-graphite: #202522;
      --client-graphite-soft: #333a36;
      --client-ink: #1b211e;
      --client-muted: #68706b;
      --client-line: #c9c8bf;
      --client-orange: #f06422;
      --client-green: #177a57;
      --client-blue: #216a91;
      --client-red: #b43d35;
    }

    body.page-cliente {
      min-height: 100vh !important;
      overflow-x: hidden;
      overflow-y: auto;
      background: var(--client-paper) !important;
      color: var(--client-ink) !important;
      letter-spacing: 0;
    }

    body.page-cliente::after { display: none !important; }

    body.page-cliente aside.client-sidebar {
      width: 272px !important;
      min-width: 272px !important;
      padding: 26px 22px 20px !important;
      background: var(--client-graphite) !important;
      border: 0 !important;
      border-right: 5px solid var(--client-orange) !important;
      box-shadow: none !important;
      backdrop-filter: none !important;
    }

    body.page-cliente .client-sidebar .logo {
      display: grid !important;
      grid-template-columns: 48px 1fr;
      gap: 12px !important;
      margin: 0 0 32px !important;
      min-height: 48px;
      color: #f6f1e7;
    }

    body.page-cliente .client-sidebar .mark,
    body.page-cliente .mobile-brand .mark {
      width: 48px !important;
      height: 48px !important;
      border-radius: 2px !important;
      background: var(--client-orange) !important;
      box-shadow: none !important;
      color: #171a18 !important;
      font-family: "Arial Narrow", Arial, sans-serif;
      font-size: 17px !important;
      letter-spacing: -.05em;
    }

    .client-brand-copy { display: grid; align-content: center; gap: 2px; }
    .client-brand-copy strong { color: #fff; font-size: 18px; letter-spacing: -.03em; }
    .client-brand-copy small {
      color: #a9b0ab;
      font-family: Consolas, "Courier New", monospace;
      font-size: 9px;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .client-module-tag {
      margin-bottom: 24px;
      padding: 13px 0;
      border-top: 1px solid #4c544f;
      border-bottom: 1px solid #4c544f;
      color: #d9ddd8;
      font-family: Consolas, "Courier New", monospace;
      font-size: 10px;
      line-height: 1.65;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    body.page-cliente .client-sidebar nav::before {
      content: "ÁREA DO CLIENTE";
      margin: 0 10px 9px;
      color: #858f88;
      font-family: Consolas, "Courier New", monospace;
      font-size: 9px;
      letter-spacing: .16em;
    }

    body.page-cliente .client-sidebar nav { gap: 2px !important; }
    body.page-cliente .client-sidebar nav a {
      min-height: 48px;
      padding: 0 10px !important;
      border: 0 !important;
      border-bottom: 1px solid #373d39 !important;
      border-radius: 0 !important;
      color: #c8cec9 !important;
      font-size: 13px;
      font-weight: 650;
    }

    body.page-cliente .client-sidebar nav a:hover {
      padding-left: 15px !important;
      background: #292f2b !important;
      transform: none !important;
    }

    body.page-cliente .client-sidebar nav a.active {
      padding-left: 15px !important;
      background: transparent !important;
      border-color: #515953 !important;
      box-shadow: inset 4px 0 0 var(--client-orange) !important;
      color: #fff !important;
    }

    body.page-cliente .nav-icon { color: var(--client-orange); }
    body.page-cliente .client-sidebar .profile-card {
      margin-top: auto !important;
      padding: 15px 0 !important;
      border: 0 !important;
      border-top: 1px solid #4c544f !important;
      border-bottom: 1px solid #4c544f !important;
      border-radius: 0 !important;
      background: transparent !important;
    }

    body.page-cliente .client-sidebar .profile-avatar {
      border: 1px solid var(--client-orange);
      border-radius: 2px;
      background: transparent;
      color: var(--client-orange);
      box-shadow: none;
    }

    body.page-cliente .client-sidebar .profile-card strong { color: #fff; }
    body.page-cliente .client-sidebar .profile-card small { color: #9aa29c; }

    body.page-cliente .client-sidebar .logout {
      display: grid;
      place-items: center;
      min-height: 40px;
      border: 1px solid #5b3c36 !important;
      border-radius: 2px !important;
      background: transparent !important;
      color: #e79b8e !important;
      font-size: 12px;
      text-decoration: none;
    }

    body.page-cliente main.client-main {
      position: relative;
      padding: 38px clamp(24px, 4vw, 66px) 58px !important;
      background-color: var(--client-paper) !important;
      background-image:
        linear-gradient(rgba(32, 37, 34, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(32, 37, 34, .035) 1px, transparent 1px) !important;
      background-size: 28px 28px !important;
      color: var(--client-ink) !important;
    }

    body.page-cliente main.page-enter { animation: none !important; }

    .client-heading {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 24px;
      padding-bottom: 22px;
      border-bottom: 3px solid var(--client-graphite);
    }

    .document-code,
    .section-code,
    .order-number {
      font-family: Consolas, "Courier New", monospace;
      text-transform: uppercase;
    }

    .document-code {
      display: inline-flex;
      gap: 9px;
      align-items: center;
      margin-bottom: 11px;
      color: var(--client-muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .14em;
    }

    .document-code::before {
      content: "";
      width: 26px;
      height: 5px;
      background: var(--client-orange);
    }

    body.page-cliente main h1 {
      max-width: 780px;
      color: var(--client-graphite) !important;
      font-family: "Arial Narrow", Arial, sans-serif !important;
      font-size: clamp(38px, 5vw, 66px) !important;
      font-weight: 900 !important;
      line-height: .94;
      letter-spacing: -.055em !important;
      text-transform: uppercase;
    }

    .client-heading p {
      max-width: 680px;
      margin: 13px 0 0;
      color: var(--client-muted) !important;
      font-size: 14px;
      line-height: 1.55;
    }

    .client-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .client-button {
      min-height: 44px;
      padding: 0 17px;
      border: 1px solid var(--client-graphite);
      border-radius: 2px;
      background: transparent;
      color: var(--client-graphite);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .035em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .client-button:hover { background: #e3e0d7; }
    .client-button.primary {
      border-color: var(--client-orange);
      background: var(--client-orange);
      color: #171a18;
    }
    .client-button.primary:hover { background: #dd5419; }

    .service-ledger {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      margin: 26px 0 34px;
      border-top: 1px solid var(--client-graphite);
      border-bottom: 1px solid var(--client-graphite);
      background: var(--client-paper-strong);
    }

    .ledger-cell {
      position: relative;
      min-height: 118px;
      padding: 19px 22px 16px;
      border-right: 1px solid var(--client-line);
    }

    .ledger-cell:last-child { border-right: 0; }
    .ledger-index {
      position: absolute;
      top: 15px;
      right: 16px;
      color: #a7aaa4;
      font-family: Consolas, "Courier New", monospace;
      font-size: 10px;
    }
    .ledger-cell span:not(.ledger-index) {
      display: block;
      max-width: 170px;
      color: var(--client-muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .09em;
      line-height: 1.35;
      text-transform: uppercase;
    }
    .ledger-cell strong {
      display: block;
      margin-top: 12px;
      color: var(--client-graphite);
      font-family: "Arial Narrow", Arial, sans-serif;
      font-size: 34px;
      line-height: 1;
    }

    .orders-section {
      border: 1px solid var(--client-line);
      background: var(--client-paper-strong);
    }

    .orders-toolbar {
      display: grid;
      grid-template-columns: auto 1fr;
      align-items: stretch;
      border-bottom: 1px solid var(--client-line);
    }

    .section-code {
      display: grid;
      place-items: center;
      min-width: 110px;
      padding: 15px;
      background: var(--client-graphite);
      color: #fff;
      font-size: 10px;
      letter-spacing: .11em;
    }

    .work-tabs { display: flex; min-width: 0; overflow-x: auto; }
    .tab-link {
      display: grid;
      place-items: center;
      min-height: 52px;
      padding: 0 22px;
      border-right: 1px solid var(--client-line);
      border-bottom: 4px solid transparent;
      color: var(--client-muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .06em;
      text-decoration: none;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .tab-link:hover { color: var(--client-graphite); }
    .tab-link.active {
      border-bottom-color: var(--client-orange);
      color: var(--client-graphite);
    }

    .tab-content { display: none; padding: 22px; }
    .solicitacoes-list { display: grid; gap: 13px; }

    .soli-card {
      display: grid;
      grid-template-columns: 190px minmax(0, 1fr) auto;
      min-height: 150px;
      border: 1px solid var(--client-line);
      border-left: 6px solid var(--client-orange);
      border-radius: 0;
      background: #faf8f1;
      color: var(--client-ink);
    }
    .soli-card.analysis { border-left-color: var(--client-blue); }
    .soli-card.approved { border-left-color: var(--client-green); }
    .soli-card.rejected { border-left-color: var(--client-red); }

    .order-id-panel {
      padding: 20px;
      border-right: 1px dashed #aaa9a1;
      background: #e9e6dc;
    }
    .order-number { color: var(--client-muted); font-size: 10px; letter-spacing: .08em; }
    .order-number strong {
      display: block;
      margin-top: 8px;
      color: var(--client-graphite);
      font-size: 19px;
      letter-spacing: -.03em;
    }
    .order-date { margin-top: 24px; color: var(--client-muted); font-size: 11px; line-height: 1.45; }

    .order-content { min-width: 0; padding: 20px 24px; }
    .order-content h3 {
      margin: 0 0 12px;
      color: var(--client-graphite);
      font-family: "Arial Narrow", Arial, sans-serif;
      font-size: 21px;
      letter-spacing: -.025em;
      text-transform: uppercase;
    }
    .order-content p { margin: 0; color: #555d58; font-size: 13px; line-height: 1.55; }
    .problem-label {
      display: block;
      margin-bottom: 5px;
      color: #858b86;
      font-family: Consolas, "Courier New", monospace;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .order-state-panel {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: space-between;
      min-width: 190px;
      padding: 20px;
      border-left: 1px solid var(--client-line);
    }
    .soli-status {
      align-self: flex-start;
      padding: 7px 9px;
      border: 1px solid currentColor;
      border-radius: 0;
      background: transparent !important;
      color: var(--client-orange) !important;
      font-family: Consolas, "Courier New", monospace;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .analysis .soli-status { color: var(--client-blue) !important; }
    .approved .soli-status { color: var(--client-green) !important; }
    .rejected .soli-status { color: var(--client-red) !important; }

    .order-budget { margin-top: 18px; color: var(--client-graphite); font-size: 13px; }
    .order-budget strong { display: block; margin-top: 4px; font-size: 18px; }
    .order-actions { display: flex; gap: 6px; margin-top: 12px; }
    .order-action {
      flex: 1;
      min-height: 36px;
      padding: 0 10px;
      border: 1px solid var(--client-graphite);
      border-radius: 1px;
      background: transparent;
      color: var(--client-graphite);
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      cursor: pointer;
    }
    .order-action.accept { border-color: var(--client-green); background: var(--client-green); color: #fff; }
    .order-action.reject { border-color: var(--client-red); color: var(--client-red); }
    .order-action.hide { width: 100%; border-color: #a09f98; color: #6f746f; }

    .empty {
      display: grid;
      place-items: center;
      min-height: 220px;
      padding: 42px;
      color: var(--client-muted);
      text-align: center;
    }
    .empty::before {
      content: "SEM REGISTROS";
      display: block;
      margin-bottom: 8px;
      color: #9b9e98;
      font-family: Consolas, "Courier New", monospace;
      font-size: 10px;
      letter-spacing: .14em;
    }
    .empty h3 { margin: 0; color: var(--client-muted); font-size: 14px; font-weight: 600; }

    body.page-cliente .product-footer {
      border-top-color: var(--client-line);
      color: #777d78;
    }

    #toast {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 1200;
      min-width: 280px;
      max-width: min(430px, calc(100vw - 32px));
      padding: 15px 17px;
      border: 1px solid #171a18;
      border-left: 6px solid var(--client-orange);
      border-radius: 0;
      background: var(--client-graphite);
      color: #fff;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(12px);
      transition: opacity .18s ease, transform .18s ease;
    }
    #toast.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 1080px) {
      .soli-card { grid-template-columns: 160px minmax(0, 1fr); }
      .order-state-panel { grid-column: 1 / -1; flex-direction: row; align-items: center; border-top: 1px solid var(--client-line); border-left: 0; }
    }

    @media (max-width: 980px) {
      body.page-cliente { overflow: auto; }
      body.page-cliente aside.client-sidebar { position: fixed; width: 272px !important; }
      body.page-cliente .mobile-topbar {
        border-bottom: 4px solid var(--client-orange);
        background: var(--client-graphite);
        box-shadow: none;
      }
      body.page-cliente .mobile-brand { color: #fff; }
      body.page-cliente .mobile-brand .mark { width: 34px !important; height: 34px !important; }
      body.page-cliente .mobile-menu { border-radius: 2px; background: transparent; color: #fff; }
      body.page-cliente main.client-main { padding: 30px 18px 46px !important; }
      .client-heading { grid-template-columns: 1fr; align-items: start; }
      .client-actions { justify-content: flex-start; }
    }

    @media (max-width: 680px) {
      .client-heading h1 { font-size: 40px !important; }
      .client-actions { display: grid; grid-template-columns: 1fr 1fr; }
      .client-button { width: 100%; padding-inline: 10px; }
      .service-ledger { grid-template-columns: 1fr; }
      .ledger-cell { min-height: 94px; border-right: 0; border-bottom: 1px solid var(--client-line); }
      .ledger-cell:last-child { border-bottom: 0; }
      .orders-toolbar { grid-template-columns: 1fr; }
      .section-code { min-width: 0; justify-content: start; place-items: center start; }
      .tab-content { padding: 12px; }
      .soli-card { grid-template-columns: 1fr; }
      .order-id-panel { border-right: 0; border-bottom: 1px dashed #aaa9a1; }
      .order-date { margin-top: 10px; }
      .order-state-panel { grid-column: auto; flex-direction: column; align-items: stretch; }
      #toast { right: 16px; bottom: 16px; min-width: 0; }
    }
  </style>
  <script src="ui.js" defer></script>
  <meta name="theme-color" content="#202522">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body class="app-page client-page page-cliente">
  <aside class="client-sidebar">
    <div class="logo">
      <span class="mark">A+</span>
      <span class="client-brand-copy">
        <strong>Auto+Assis</strong>
        <small>Serviço automotivo</small>
      </span>
    </div>

    <nav class="nav" aria-label="Área do cliente">
      <a href="cliente.html" class="active">Meus atendimentos</a>
      <a href="novasoli.html">Solicitar atendimento</a>
    </nav>

    <div class="profile-card">
      <div class="profile-avatar" id="avatarLetra">C</div>
      <div>
        <strong id="nomeUsuario">Cliente</strong>
        <small>Conta do cliente</small>
      </div>
    </div>
    <a href="login.html" class="logout" onclick="event.preventDefault(); window.apiAuth.logout()">Encerrar sessão</a>
  </aside>

  <main class="client-main">
    <header class="client-heading">
      <div>
        <h1>Meus atendimentos</h1>
        <p>Acompanhe seus serviços e aprove orçamentos.</p>
      </div>
      <div class="client-actions">
        <button type="button" class="client-button primary" onclick="window.location.href='novasoli.html'">Novo atendimento</button>
      </div>
    </header>

    <div class="client-counts" hidden aria-hidden="true"><span id="contPendente">0</span><span id="contAnalise">0</span><span id="contAprovado">0</span></div>

    <section class="orders-section" aria-labelledby="ordersTitle">
      <div class="orders-toolbar">
        <nav class="work-tabs" aria-label="Filtrar atendimentos">
          <a href="#solicitacoesTab" class="tab-link active" data-tab="solicitacoes" id="ordersTitle">Em andamento</a>
          <a href="#passadoTab" class="tab-link" data-tab="passado">Histórico</a>
        </nav>
      </div>

      <div id="solicitacoesTab" class="tab-content" style="display:block">
        <div id="soliGrid" class="solicitacoes-list"></div>
        <div id="soliEmpty" class="empty"><h3>Nenhuma solicitação ativa no momento.</h3></div>
      </div>

      <div id="passadoTab" class="tab-content">
        <div id="histGrid" class="solicitacoes-list"></div>
        <div id="histEmpty" class="empty"><h3>Seu histórico ainda está vazio.</h3></div>
      </div>
    </section>

    <div id="toast" role="status" aria-live="polite"></div>
  </main>

  <script>
    'use strict';

    function textoSeguro(valor, padrao = '', limite = 180) {
      const texto = typeof valor === 'string' ? valor.trim() : '';
      return (texto || padrao).slice(0, limite);
    }

    function numeroSeguro(valor, padrao = 0) {
      const numero = Number(valor);
      return Number.isFinite(numero) ? numero : padrao;
    }

    function idSeguro(valor) {
      const id = Number(valor);
      return Number.isSafeInteger(id) && id > 0 ? id : null;
    }

    function criarElemento(tag, classe, texto) {
      const elemento = document.createElement(tag);
      if (classe) elemento.className = classe;
      if (texto !== undefined) elemento.textContent = texto;
      return elemento;
    }

    function formatarData(valor) {
      const data = new Date(valor);
      if (Number.isNaN(data.getTime())) return 'Data não informada';
      return data.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', year: 'numeric' });
    }

    const usuarioCliente = window.apiAuth.getUsuario() || {};
    const emailCliente = textoSeguro(usuarioCliente.email || localStorage.getItem('emailUsuario'), '', 254).toLowerCase();
    const nomeCliente = textoSeguro(usuarioCliente.nome || localStorage.getItem('nomeClienteLogado'), 'Cliente', 80);
    function statusVisual(status) {
      if (status === 'Pendente') return 'pending';
      if (status === 'Em Análise' || status === 'Aguardando Aprovação') return 'analysis';
      if (status === 'Aprovado' || status === 'Em Andamento' || status === 'Concluído') return 'approved';
      if (status === 'Rejeitado') return 'rejected';
      return 'analysis';
    }

    function criarCartaoSolicitacao(solicitacao, eventos = []) {
      const status = textoSeguro(solicitacao.status, 'Status desconhecido', 50);
      const solicitacaoId = idSeguro(solicitacao.id);
      const custoSugerido = Math.max(0, numeroSeguro(solicitacao.custoSugerido));
      const card = criarElemento('article', `soli-card ${statusVisual(status)}`);

      const identificacao = criarElemento('div', 'order-id-panel');
      const numero = criarElemento('div', 'order-number', 'Protocolo');
      numero.appendChild(criarElemento('strong', '', `SOL-${solicitacaoId || '—'}`));
      const data = criarElemento('div', 'order-date', `Aberto em\n${formatarData(solicitacao.dataCriacao)}`);
      data.style.whiteSpace = 'pre-line';
      identificacao.append(numero, data);

      const conteudo = criarElemento('div', 'order-content');
      conteudo.appendChild(criarElemento('h3', '', textoSeguro(solicitacao.veiculo, 'Veículo não informado')));
      conteudo.appendChild(criarElemento('span', 'problem-label', 'Relato informado'));
      conteudo.appendChild(criarElemento('p', '', textoSeguro(solicitacao.problema, 'Problema não informado', 500)));

      const estado = criarElemento('div', 'order-state-panel');
      estado.appendChild(criarElemento('span', 'soli-status', status));

      if (eventos.length) {
        const historico = document.createElement('details');
        historico.className = 'client-audit';
        const tituloHistorico = document.createElement('summary');
        tituloHistorico.textContent = `Histórico do atendimento (${eventos.length})`;
        historico.appendChild(tituloHistorico);
        eventos.slice(0, 8).forEach((evento) => {
          const linha = criarElemento('p', '', `${formatarData(evento.criadoEm)} · ${textoSeguro(evento.resumo, 'Atendimento atualizado')} · ${textoSeguro(evento.autor, 'Oficina')}`);
          historico.appendChild(linha);
        });
        estado.appendChild(historico);
      }

      if (status === 'Aguardando Aprovação' && solicitacaoId) {
        const blocoOrcamento = criarElemento('div', 'order-budget', 'Orçamento proposto');
        blocoOrcamento.appendChild(criarElemento('strong', '', custoSugerido.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })));
        const botoes = criarElemento('div', 'order-actions');
        const aceitar = criarElemento('button', 'order-action accept', 'Aceitar');
        aceitar.type = 'button';
        aceitar.addEventListener('click', () => decidir(solicitacaoId, 'Aprovado', custoSugerido));
        const recusar = criarElemento('button', 'order-action reject', 'Recusar');
        recusar.type = 'button';
        recusar.addEventListener('click', () => decidir(solicitacaoId, 'Rejeitado'));
        botoes.append(aceitar, recusar);
        blocoOrcamento.appendChild(botoes);
        estado.appendChild(blocoOrcamento);
      }

      card.append(identificacao, conteudo, estado);
      return { card, status };
    }

    async function carregarDados() {
      const soliGrid = document.getElementById('soliGrid');
      const histGrid = document.getElementById('histGrid');

      try {
        const [resposta, respostaAuditoria] = await Promise.all([
          window.apiAuth.fetch('/api/solicitacoes'),
          window.apiAuth.fetch('/api/auditoria/meus-atendimentos')
        ]);
        if (!resposta.ok) throw new Error('Não foi possível carregar os atendimentos.');

        const dados = await resposta.json();
        const eventosAuditoria = respostaAuditoria.ok ? await respostaAuditoria.json() : [];
        const auditoriaPorSolicitacao = new Map();
        if (Array.isArray(eventosAuditoria)) eventosAuditoria.forEach((evento) => {
          const id = idSeguro(evento.solicitacaoId);
          if (!id) return;
          if (!auditoriaPorSolicitacao.has(id)) auditoriaPorSolicitacao.set(id, []);
          auditoriaPorSolicitacao.get(id).push(evento);
        });
        if (!Array.isArray(dados)) throw new Error('Resposta inválida do servidor.');
        const minhasSolicitacoes = dados.filter((solicitacao) => {
          const pertenceAoCliente = !emailCliente || textoSeguro(solicitacao?.emailCliente, '', 254).toLowerCase() === emailCliente;
          return pertenceAoCliente;
        });

        let pendentes = 0;
        let analise = 0;
        let aprovados = 0;
        soliGrid.replaceChildren();
        histGrid.replaceChildren();

        minhasSolicitacoes.forEach((solicitacao) => {
          const { card, status } = criarCartaoSolicitacao(solicitacao, auditoriaPorSolicitacao.get(idSeguro(solicitacao.id)) || []);
          if (status === 'Pendente' || status === 'Rejeitado') pendentes += 1;
          else if (status === 'Em Análise' || status === 'Aguardando Aprovação') analise += 1;
          else if (status === 'Aprovado' || status === 'Em Andamento' || status === 'Concluído') aprovados += 1;

          if (status === 'Concluído' || status === 'Rejeitado') histGrid.appendChild(card);
          else soliGrid.appendChild(card);
        });

        document.getElementById('soliEmpty').style.display = soliGrid.children.length ? 'none' : 'grid';
        document.getElementById('histEmpty').style.display = histGrid.children.length ? 'none' : 'grid';
        document.getElementById('contPendente').textContent = String(pendentes);
        document.getElementById('contAnalise').textContent = String(analise);
        document.getElementById('contAprovado').textContent = String(aprovados);
      } catch (erro) {
        console.error('Erro ao carregar atendimentos:', erro);
        mostrarToast(erro.message || 'Erro ao carregar os atendimentos.');
      }
    }

    function getCor(status) {
      if (status === 'Pendente') return 'var(--client-orange)';
      if (status === 'Aprovado' || status === 'Concluído' || status === 'Em Andamento') return 'var(--client-green)';
      if (status === 'Rejeitado') return 'var(--client-red)';
      return 'var(--client-blue)';
    }

    async function decidir(id, status, valor = null) {
      const solicitacaoId = idSeguro(id);
      const statusPermitidos = new Set(['Aprovado', 'Rejeitado']);
      if (!solicitacaoId || !statusPermitidos.has(status)) {
        mostrarToast('Não foi possível identificar esta solicitação.');
        return;
      }
      if (!window.confirm(`Deseja marcar o orçamento como ${status.toLowerCase()}?`)) return;

      try {
        const resposta = await window.apiAuth.fetch(`/api/solicitacoes/${solicitacaoId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status })
        });
        if (!resposta.ok) {
          const dadosErro = await resposta.json().catch(() => ({}));
          throw new Error(dadosErro.erro || 'Não foi possível registrar sua decisão.');
        }
        mostrarToast(status === 'Aprovado' ? 'Orçamento aceito. A oficina foi avisada.' : 'Orçamento recusado. A oficina foi avisada.');
        await carregarDados();
      } catch (erro) {
        console.error('Erro ao atualizar solicitação:', erro);
        mostrarToast(erro.message || 'Erro ao conectar com o servidor.');
      }
    }

    function switchTab(tab) {
      if (!['solicitacoes', 'passado'].includes(tab)) return;
      document.querySelectorAll('.tab-content').forEach((conteudo) => { conteudo.style.display = 'none'; });
      document.querySelectorAll('.work-tabs .tab-link').forEach((link) => link.classList.remove('active'));
      document.getElementById(`${tab}Tab`).style.display = 'block';
      document.querySelector(`.work-tabs [data-tab="${tab}"]`)?.classList.add('active');
    }

    document.querySelectorAll('.work-tabs [data-tab]').forEach((elemento) => {
      elemento.addEventListener('click', (evento) => {
        evento.preventDefault();
        switchTab(evento.currentTarget.dataset.tab);
      });
    });

    function mostrarToast(texto) {
      const toast = document.getElementById('toast');
      toast.textContent = textoSeguro(texto, 'Operação concluída.', 260);
      toast.classList.add('show');
      window.clearTimeout(window.__toastTimer);
      window.__toastTimer = window.setTimeout(() => toast.classList.remove('show'), 3200);
    }

    document.getElementById('nomeUsuario').textContent = nomeCliente;
    document.getElementById('avatarLetra').textContent = nomeCliente.charAt(0).toUpperCase() || 'C';
    carregarDados();
  </script>
</body>
</html>
